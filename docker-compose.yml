services:
  postgres:
    image: postgres:16-alpine
    container_name: smart-bookshelf-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: bookshelf_admin
      POSTGRES_PASSWORD: bookshelf_secret_password
      POSTGRES_DB: smart_bookshelf
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
