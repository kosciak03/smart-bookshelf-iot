# Local development stack: PostgreSQL + MQTT broker + backend API + frontend (hot reload).
# Usage: docker compose up --build
services:
  postgres:
    image: postgres:16-alpine
    container_name: smart-bookshelf-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bookshelf_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bookshelf_secret_password}
      POSTGRES_DB: ${POSTGRES_DB:-smart_bookshelf}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Dedicated, throw-away database for integration tests (npm test).
  # Data lives in RAM (tmpfs) and durability is disabled for speed; it is never
  # shared with the development database above.
  postgres-test:
    image: postgres:16-alpine
    container_name: smart-bookshelf-db-test
    restart: unless-stopped
    environment:
      POSTGRES_USER: bookshelf_test
      POSTGRES_PASSWORD: bookshelf_test
      POSTGRES_DB: smart_bookshelf_test
    command: ["postgres", "-c", "fsync=off", "-c", "synchronous_commit=off", "-c", "full_page_writes=off"]
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # MQTT broker for the ESP32 shelf (port 1883 must be reachable from the LAN).
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: smart-bookshelf-mqtt
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config:ro
      - mosquitto_data:/mosquitto/data
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h 127.0.0.1 -t '$$SYS/broker/uptime' -C 1 -W 3 > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: smart-bookshelf-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-bookshelf_admin}:${POSTGRES_PASSWORD:-bookshelf_secret_password}@postgres:5432/${POSTGRES_DB:-smart_bookshelf}?schema=public
      CORS_ORIGIN: http://localhost:5173
      MQTT_URL: mqtt://mosquitto:1883
      # Used by `npm test` inside the container (see src/test/test-database.ts).
      TEST_DATABASE_URL: postgresql://bookshelf_test:bookshelf_test@postgres-test:5432/smart_bookshelf_test?schema=public
      # Bind mounts from Windows/macOS do not emit inotify events, so watch by polling.
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "3000:3000"
      - "5555:5555" # Prisma Studio: docker compose exec backend npm run db:studio
    volumes:
      - ./backend:/app
      - /app/node_modules # keep Linux node_modules from the image, not the host's
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: smart-bookshelf-web
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_PROXY_TARGET: http://backend:3000
      VITE_USE_POLLING: "true"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules # keep Linux node_modules from the image, not the host's

volumes:
  postgres_data:
  mosquitto_data:
