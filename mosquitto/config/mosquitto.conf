# Eclipse Mosquitto 2 — MQTT broker between the ESP32 shelf and the backend.
#
# DEVELOPMENT CONFIGURATION: anonymous access on the local network.
# Before exposing the broker outside a trusted LAN, add a password file
# (mosquitto_passwd) and set `allow_anonymous false`.

# Plain MQTT for the ESP32 and the backend.
listener 1883 0.0.0.0
allow_anonymous true

# Keep retained messages (LED state, device status) across broker restarts.
persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
